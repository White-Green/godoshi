name: Deploy

on:
  push:
    branches:
      - main

env:
  WRANGLER_VERSION: "4.152.0"

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  deploy:
    name: Deploy to Cloudflare Workers
    runs-on: ubuntu-latest
    needs: ci
    permissions:
      contents: read
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Rust
        id: rust-toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.22.1"
          package-manager-cache: false

      - name: Cache Cargo dependencies
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}

      - name: Cache Rust target
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target
          key: ${{ runner.os }}-production-target-${{ steps.rust-toolchain.outputs.cachekey }}-${{ hashFiles('Cargo.lock') }}

      - name: Resolve worker-build revision
        id: worker-build-revision
        shell: bash
        run: |
          SHA=$(git ls-remote --exit-code https://github.com/White-Green/workers-rs refs/heads/codegen | cut -f1)
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Cache worker-build
        id: cache-worker-build
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/worker-build
          key: ${{ runner.os }}-${{ runner.arch }}-worker-build-${{ steps.rust-toolchain.outputs.cachekey }}-${{ steps.worker-build-revision.outputs.sha }}

      - name: Install worker-build
        if: steps.cache-worker-build.outputs.cache-hit != 'true'
        run: cargo install worker-build --git https://github.com/White-Green/workers-rs --rev "$WORKER_BUILD_REVISION" --locked
        env:
          WORKER_BUILD_REVISION: ${{ steps.worker-build-revision.outputs.sha }}

      - uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        name: Apply D1 migrations
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: ${{ env.WRANGLER_VERSION }}
          command: d1 migrations apply godoshi-db --remote

      - name: Setup assets
        run: |          
          npm ci
          cp node_modules/bootstrap/dist/css/bootstrap.min.css* assets/static/
          cp node_modules/bootstrap/LICENSE assets/static/bootstrap-LICENSE.txt

      - uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: ${{ env.WRANGLER_VERSION }}
          command: deploy --var R2_ACCOUNT_ID:${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

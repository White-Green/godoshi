[package]
authors = ["White-Green <43771790+White-Green@users.noreply.github.com>"]
edition = "2024"
name = "godoshi"
version = "0.1.0"

[lib]
crate-type = ["cdylib"]

[features]
worker-tests = []

[package.metadata.cargo-binaries]
taplo-cli = "0.10.0"

[dependencies]
askama = { features = ["code-in-doc", "derive"], version = "0.16.1" }
async-trait = "0.1.92"
axum = { default-features = false, features = [
  "form",
  "json",
  "macros",
  "multipart",
  "original-uri",
  "query",
], version = "0.8.9" }
axum-extra = { default-features = false, features = [
  "cookie-key-expansion",
  "cookie-private",
], version = "0.12.6" }
base64 = "0.23.1"
bitflags = "2.13.2"
bytes = "1.12.1"
crc-fast = { default-features = false, version = "1.10.0" }
futures = "0.3.34"
getrandom = { features = ["wasm_js"], version = "0.4.3" }
oauth2 = { default-features = false, features = [
  "timing-resistant-secret-traits",
], version = "5.0.0" }
percent-encoding = "2.3.2"
s3s = "0.17.0"
serde = { features = ["derive"], version = "1.0.229" }
serde_json = "1.0.151"
smol_str = { features = ["serde"], version = "0.3.6" }
thiserror = "2.0.21"
time = { features = ["wasm-bindgen"], version = "0.3.55" }
tower = "0.5.3"
tower-service = "0.3.3"
tracing = "0.1.44"
tracing-subscriber = { default-features = false, features = [
  "fmt",
  "json",
], version = "0.3.23" }
tracing-web = "0.1.3"
wasm-bindgen = "0.2"
worker = { branch = "codegen", features = [
  "d1",
  'axum',
  'http',
  'queue',
], git = "https://github.com/White-Green/workers-rs" }

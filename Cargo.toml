[package]
authors = ["White-Green <43771790+White-Green@users.noreply.github.com>"]
edition = "2024"
name = "godoshi"
version = "0.1.0"

[lib]
crate-type = ["cdylib"]

[package.metadata.cargo-binaries]
taplo-cli = "0.10.0"

[dependencies]
axum = { default-features = false, features = [
  "json",
  "macros",
  "query",
], version = "0.8.9" }
axum-extra = { default-features = false, features = [
  "cookie-private",
], version = "0.12.6" }
futures = "0.3.34"
oauth2 = { default-features = false, features = [
  "timing-resistant-secret-traits",
], version = "5.0.0" }
serde = { features = ["derive"], version = "1.0.229" }
serde_json = "1.0.151"
smol_str = { features = ["serde"], version = "0.3.6" }
thiserror = "2.0.21"
time = "0.3.55"
tower = "0.5.3"
tower-service = "0.3.3"
wasm-bindgen = "0.2"
worker = { branch = "codegen", features = [
  'axum',
  'http',
  'queue',
], git = "https://github.com/White-Green/workers-rs" }

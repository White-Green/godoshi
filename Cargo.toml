[package]
authors = ["White-Green <43771790+White-Green@users.noreply.github.com>"]
edition = "2021"
name = "godoshi"
version = "0.1.0"

[lib]
crate-type = ["cdylib"]

[package.metadata.cargo-binaries]
taplo-cli = "0.10.0"

[dependencies]
axum = { default-features = false, version = "0.8" }
tower-service = "0.3.3"
wasm-bindgen = "0.2"
worker = { branch = "codegen", features = [
  'axum',
  'http',
  'queue',
], git = "https://github.com/White-Green/workers-rs" }

compatibility_date = "2026-09-26"
main = "build/index.js"
name = "godoshi-worker"
workers_dev = false

[build]
command = "worker-build --release"

[vars]
BASE_URL = "https://godoshi.white-green.net"

[[containers]]
class_name = "MyContainer"
image = "./container/Dockerfile"
max_instances = 10

[[durable_objects.bindings]]
class_name = "MyContainer"
name = "CONTAINER"

[[migrations]]
new_sqlite_classes = ["MyContainer"]
tag = "v1"

[[d1_databases]]
binding = "DB"
database_id = "345390c6-a0fb-4b9c-b8ca-9e862dfdf196"
database_name = "godoshi-db"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "godoshi-runtime-bucket"

[[queues.producers]]
binding = "JOB_QUEUE"
queue = "godoshi-job-queue"

[[queues.consumers]]
queue = "godoshi-job-queue"
